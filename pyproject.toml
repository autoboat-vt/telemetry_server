[project]
name            = "telemetry_server"
version         = "0.0.0"
description     = "Telemetry server for the Virginia Tech Autoboat project."
readme          = "README.md"
requires-python = ">=3.12"
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE"]
authors         = [{ name = "Virginia Tech Autoboat Team" }]
keywords        = ["autoboat", "telemetry", "flask", "virginia-tech"]
# Note: no "License ::" classifier - PEP 639 requires the `license` SPDX
# expression below to be the sole source of license metadata.
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# Only direct imports are listed here. Transitive dependencies
# (blinker, click, itsdangerous, Jinja2, MarkupSafe, packaging, Werkzeug)
# are pulled in automatically by Flask and Flask-SQLAlchemy and must not be
# pinned separately - doing so causes drift between what Flask allows and
# what we pin.
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-Cors>=5.0,<7.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "gunicorn>=23.0,<27.0",
    "SQLAlchemy>=2.0,<3.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
# Runtime + tooling for local development. Ruff is pinned here so the same
# version is used locally and in CI; pytest runs the test suite in tests/.
dev = [
    "build>=1.3,<2.0",
    "pyproject_hooks>=1.2,<2.0",
    "ruff>=0.6,<1.0",
    "pytest>=8.0,<10.0",
    "annotated-types>=0.7,<1.0",
    "typing_extensions>=4.14,<5.0",
    "typing-inspection>=0.4,<1.0",
]

[project.urls]
Repository    = "https://github.com/autoboat-vt/telemetry_server"
Documentation = "https://autoboat-vt.github.io/documentation"
Issues        = "https://github.com/autoboat-vt/telemetry_server/issues"

[build-system]
# setuptools >= 77 is required for PEP 639 license-expression support
# (the `license = "GPL-3.0-or-later"` SPDX field below).
requires      = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["autoboat_telemetry_server*"]

[tool.setuptools.package-data]
# Bundle the Alembic migrations tree inside the installed package so that
# `Migrate(directory=...)` in create_app() can resolve it relative to
# __file__ regardless of whether the package is installed editable, as a
# wheel, or copied into a Docker image. Without this, the entrypoint's
# `flask db upgrade` fails with "Path doesn't exist: .../migrations" because
# __file__ points into site-packages and the migrations/ dir was only COPY'd
# to WORKDIR in the Dockerfile (not into the package). See AGENTS.md #6.2.
autoboat_telemetry_server = [
    "py.typed",
    "migrations/*.ini",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

# Ruff is configured in ruff.toml (select = ["ALL"] with a curated ignore
# list). This stub just makes `ruff` aware of the project root when invoked
# from outside the repo; the authoritative settings live in ruff.toml.
[tool.ruff]
line-length = 130

# The test suite lives in tests/ at the repo root (see AGENTS.md #4).
# Run it with `pytest` after `pip install -e ".[dev]"`.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
pythonpath = ["src"]
