[project]
name = "telemetry_server"
version = "0.0.0"
description = "Telemetry server for the Virginia Tech Autoboat project."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Autoboat at Virginia Tech", email = "autoboat@vt.edu" }]
keywords = [
    "autonomous boat",
    "autonomous vehicle",
    "autoboat",
    "flask",
    "prometheus",
    "sqlalchemy",
    "telemetry",
    "virginia tech",
    "vt",
    "watercraft",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-Cors>=5.0,<7.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "gunicorn>=23.0,<27.0",
    "SQLAlchemy>=2.0,<3.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2.0",
    "pyproject_hooks>=1.2,<2.0",
    "ruff>=0.6,<1.0",
    "pytest>=8.0,<10.0",
    "annotated-types>=0.7,<1.0",
    "typing_extensions>=4.14,<5.0",
    "typing-inspection>=0.4,<1.0",
]

[project.urls]
homepage      = "https://autoboat.aoe.vt.edu"
source        = "https://github.com/autoboat-vt/telemetry_server"
documentation = "https://autoboat-vt.github.io/documentation"
issues        = "https://github.com/autoboat-vt/telemetry_server/issues"

[build-system]
requires      = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["autoboat_telemetry_server*"]

[tool.setuptools.package-data]
autoboat_telemetry_server = [
    "migrations/*.ini",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
pythonpath = ["src"]
